# api-service (control-plane API): production overlay. Deltas only; baseline is environments/base.yaml.
replicaCount: 3

config:
  env:
    ENVIRONMENT: "prod"
    LOG_LEVEL: "warn"
    MOCK_AUTH_ENABLED: "false"
    OIDC_ISSUER: "https://auth.example.com"
    ALLOWED_REGISTRIES: "registry.example.com"

# The signing key for log tickets (LG4) comes from this Secret, provisioned by External Secrets Operator, Vault or SOPS
# (K3). It must exist in the release namespace with the key `signing-key` (a PEM private key). No bootstrap secret here.
secrets:
  existingSecret: api-service-secrets
  bootstrapSecretKey: ""

allowedNamespaces:
  - workloads

resources:
  requests:
    cpu: 200m
    memory: 256Mi
  limits:
    cpu: 1000m
    memory: 512Mi

# Cookie session affinity (D29): keeps one client on one API replica, so per-replica state
# (rate limits, stream counts, ticket reuse) works per client. A hint only; nothing depends on it.
service:
  annotations:
    traefik.ingress.kubernetes.io/service.sticky.cookie: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.name: "deploy_affinity"
    traefik.ingress.kubernetes.io/service.sticky.cookie.secure: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.httponly: "true"
    traefik.ingress.kubernetes.io/service.sticky.cookie.samesite: "strict"
    traefik.ingress.kubernetes.io/service.sticky.cookie.maxage: "3600"

ingress:
  enabled: true
  hosts:
    - host: api.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - hosts:
        - api.example.com
      secretName: api-tls-cert

podDisruptionBudget:
  enabled: true
  minAvailable: 2

autoscaling:
  enabled: true
  minReplicas: 3
  maxReplicas: 20
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 75

networkPolicy:
  enabled: true
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 8000
          protocol: TCP
  egress:
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # Kubernetes API server and the OIDC provider (HTTPS)
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - port: 443
          protocol: TCP
        - port: 6443
          protocol: TCP

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - api-service
          topologyKey: kubernetes.io/hostname
