# Template for the control plane's own secrets (K1, K3). Copy to api-service.secrets.yaml (gitignored) and fill in.
# In real environments use secrets.existingSecret with External Secrets Operator, Vault, or SOPS instead.
#   bootstrap-secret: openssl rand -base64 32
#   signing-key:      openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048
secretData:
  enabled: true
  data:
    bootstrap-secret: "REPLACE_ME"
    signing-key: |
      -----BEGIN PRIVATE KEY-----
      REPLACE_ME
      -----END PRIVATE KEY-----
