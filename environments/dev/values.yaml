# Development environment overlay
replicaCount: 1

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 128Mi

env:
  - name: APP_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"

ingress:
  enabled: true
  hosts:
    - host: app.dev.local
      paths:
        - path: /
          pathType: Prefix

podDisruptionBudget:
  enabled: false

autoscaling:
  enabled: false

networkPolicy:
  enabled: false
