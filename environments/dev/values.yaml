# Development environment overlay
replicaCount: 1

image:
  repository: shakudo-k8s-service
  tag: "v1.0.0"
  pullPolicy: IfNotPresent

containerPort: 8000

service:
  type: ClusterIP
  port: 8000
  targetPort: 8000

probes:
  liveness:
    enabled: true
    httpGet:
      path: /healthz
      port: http
    initialDelaySeconds: 5
    periodSeconds: 5
  readiness:
    enabled: true
    httpGet:
      path: /readyz
      port: http
    initialDelaySeconds: 3
    periodSeconds: 3

rbac:
  enabled: true
  targetNamespace: "app-dev"
  role:
    rules:
      - apiGroups: [""]
        resources: ["pods", "pods/status"]
        verbs: ["get", "list", "watch"]

env:
  - name: APP_ENV
    value: "development"
  - name: LOG_LEVEL
    value: "debug"
  - name: PORT
    value: "8000"
  - name: MOCK_AUTH_ENABLED
    value: "true"

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    cpu: 200m
    memory: 256Mi

ingress:
  enabled: true
  hosts:
    - host: app.dev.local
      paths:
        - path: /
          pathType: Prefix

podDisruptionBudget:
  enabled: false

autoscaling:
  enabled: false

networkPolicy:
  enabled: false
