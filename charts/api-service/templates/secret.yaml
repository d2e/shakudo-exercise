{{- if and .Values.secretData.enabled (not .Values.secrets.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "api-service.fullname" . }}-secrets
  labels:
    {{- include "api-service.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- toYaml .Values.secretData.data | nindent 2 }}
{{- end }}
